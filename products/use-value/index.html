<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#165b48"><title>モトログ — 使うたび、いい買い物に。</title>
<link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script>
</head>
<body>
<header><a href="../../">← Happy Ideas</a><span>持ち物と、長く付き合う。</span></header>
<main>
<section class="hero"><div><p class="eyebrow">MOTOLOG / モトログ</p><h1>使うたび、<br>いい買い物に。</h1><p>お気に入りを使ったら、ワンタップ。<br>1回あたりの値段と、あなたの満足を記録しよう。</p><button id="add" class="primary">＋ 持ち物を登録</button></div><div class="hero-note"><span>今日のお気に入りは？</span><strong>買った後の<br>うれしいを育てる。</strong><p>値段だけでなく、<br>「使ってよかった」も大切に。</p></div></section>
<section id="stats" class="stats" aria-label="持ち物のまとめ"></section>
<section class="collection"><div class="section-head"><h2>わたしの持ち物</h2><button id="demo">サンプルを追加</button></div><div class="toolbar"><input id="search" type="search" placeholder="持ち物を検索" aria-label="持ち物を検索"><select id="sort" aria-label="並び替え"><option value="recent">登録が新しい順</option><option value="unused">最近使っていない順</option><option value="value">1回あたりが安い順</option><option value="rating">満足度が高い順</option></select></div><div id="cards" class="cards"></div></section>
<section class="backup"><div><h2>記録を大切に</h2><p>このブラウザに保存します。ブラウザのデータ削除に備え、バックアップを残してください。写真も端末の外へ送信しません。</p></div><button id="export">バックアップ保存</button><label class="file-button">バックアップを復元<input id="import" type="file" accept="application/json,.json"></label></section>
<p class="footnote">「1回あたり」は購入額 ÷ 使用回数です。金銭的な回収や節約額を示すものではありません。</p>
</main><p id="status" role="status" aria-live="polite"></p>
<dialog id="editor"><form id="form"><div class="section-head"><h2 id="editor-title">持ち物を登録</h2><button type="button" id="close" aria-label="閉じる">✕</button></div>
<label>名前<input name="name" maxlength="60" required placeholder="いつものスニーカー"></label>
<div class="fields"><label>購入額（円）<input name="price" type="number" min="0" max="100000000" step="1" required></label><label>目標の1回あたり（円）<input name="target" type="number" min="1" max="100000000" step="1" value="100" required></label></div>
<label>購入日<input name="purchased" type="date" required></label><label>満足度<select name="rating"><option value="0">まだわからない</option><option value="5">★★★★★ とても満足</option><option value="4">★★★★ 満足</option><option value="3">★★★ ふつう</option><option value="2">★★ いまひとつ</option><option value="1">★ 合わなかった</option></select></label>
<label>ひとこと<textarea name="note" maxlength="240" placeholder="使い心地や、買ってよかった理由"></textarea></label><label>写真（任意・10MBまで）<input id="photo" type="file" accept="image/*"></label><p id="photo-status"></p><button id="remove-photo" type="button">写真を外す</button><p id="form-error" role="alert"></p><button class="primary" id="save" type="submit">保存する</button></form></dialog>
</body></html>
