<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#e8590c">
<meta name="description" content="カメラ・通知・位置情報などWebの機能を使った、100個のアプリアイデアと試作集">
<title>Happy Ideas</title>
<link rel="icon" href="shared/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="shared/style.css">
<link rel="stylesheet" href="gallery.css">
<script type="module" src="gallery.js"></script>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <p class="eyebrow">Happy Ideas</p>
    <h1>Webの機能で作る、<br>100個のアプリの種</h1>
    <p class="hero-lead">カメラ、通知、位置情報、センサー、マイク。2026年の市場調査をもとにしたアイデアと、実際に動く試作を集めました。どれもアカウント不要で、データは端末の外に出ません。</p>
    <div class="hero-stats" id="stats" aria-live="polite"></div>
  </div>
</header>
<main class="gallery-main">
  <div class="filters" role="search">
    <input id="q" type="search" placeholder="キーワードで探す（例: 推し、カメラ、節約）" aria-label="キーワードで探す">
    <div class="chip-row" id="cats" role="group" aria-label="カテゴリ"></div>
    <div class="chip-row" id="apis" role="group" aria-label="使うWeb機能"></div>
    <label class="toggle"><input type="checkbox" id="builtOnly"> 試作があるものだけ</label>
  </div>
  <p id="count" class="muted small" aria-live="polite"></p>
  <ul class="idea-grid" id="grid"></ul>
  <footer class="gallery-footer">
    <p><a href="docs/market-research.md">市場調査メモ</a> ・ <a href="docs/feasibility.md">機能ごとの実現性レポート</a> ・ <a href="ideas/IDEAS.md">アイデア一覧（Markdown）</a></p>
    <p class="muted small">カメラ・マイク・位置情報は HTTPS か localhost でのみ動作します。</p>
  </footer>
</main>
</body>
</html>
