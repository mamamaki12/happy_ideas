<footer class="app-footer">
  <details>
    <summary>このアプリについて（#109）</summary>
    <p><b>ニーズ:</b> 物価高・家計管理・苦労キャンセル</p>
    <p><b>実現性 B（Webで動くが制約あり）:</b> OCRライブラリなしで品目・分類まで取れる。読み取りミスに備えて、合計の一致チェックと手で直せる確認画面を必ず挟む。</p>
    <p>入力した文章や写真は、AIサーバーが設定されているときだけ、答えを作るために Anthropic の Claude API へ送られます（このサイトでは保存しません）。履歴などはこの端末の中だけに保存されます。</p>
    <button type="button" class="small danger" data-clear-data="ai-receipt">このアプリのデータを消す</button>
  </details>
