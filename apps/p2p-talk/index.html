  <p class="lead">WebRTCで近くの人と音声通話・チャット。接続コードを手で交換すればサーバーなしでつながるかを検証。</p>
  <noscript><p class="error">このアプリは JavaScript が必要です。</p></noscript>
</main>
<footer class="app-footer">
  <details>
    <summary>このアプリについて（#50）</summary>
    <p><b>ニーズ:</b> イベント・防災</p>
    <p><b>実現性 B（Webで動くが制約あり）:</b> サーバーなしでも、接続コードを手で交換すれば WebRTC で音声とチャットがつながる（同じ端末の2タブで確認）。ただし中継サーバー（TURN）がないと、携帯回線同士や会社のネットワークではつながらないことがある。コードの受け渡しも手間。</p>
    <p>データはこの端末の中だけに保存され、外部には送られません。</p>
    <button type="button" class="small danger" data-clear-data="p2p-talk">このアプリのデータを消す</button>
  </details>
</footer>
