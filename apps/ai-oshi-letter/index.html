    <summary>このアプリについて（#110）</summary>
    <p><b>ニーズ:</b> 推し活4兆円・約2,000万人</p>

    <p>入力した文章や写真は、AIサーバーが設定されているときだけ、答えを作るために Anthropic の Claude API へ送られます（このサイトでは保存しません）。履歴などはこの端末の中だけに保存されます。</p>
